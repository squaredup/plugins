changelog:
  exclude:
    authors:
      - dependabot
      - github-actions
  categories:
    - title: New Plugins
      labels:
        - new-plugin
    - title: Enhancements
      labels:
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
